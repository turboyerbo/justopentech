<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JUSTOPEN.technologies</title>
<meta name="description" content="Just Open Technologies — software and architecture, open by design." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800;900&display=swap">
<style>
  :root{
    --ink: #FFFFFF;
    --ground: #002FA7;
    --ground-deep: #00248A;
    --muted: rgba(255,255,255,.62);
    --hairline: rgba(255,255,255,.22);
    --accent: #D63C0E;
    --display: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body{
    background: var(--ground);
    color: var(--ink);
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .shell{
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding-inline: clamp(16px, 4vw, 48px);
    padding-block: clamp(18px, 3vw, 32px);
    box-sizing: border-box;
    gap: clamp(24px, 6vh, 64px);
  }

  /* ---- tech menu (opens from the settled word) ---- */
  .tech{ position: relative; display: inline-flex; align-items: center; align-self: center; }
  .tech-btn{
    display: inline-flex;
    align-items: center;
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    font: inherit;
    letter-spacing: inherit;
    cursor: default;
  }
  .tech-btn.is-ready{ cursor: pointer; }
  .tech-btn:focus-visible{ outline: 2px solid var(--ink); outline-offset: 8px; }
  .tech-caret{
    flex: 0 0 auto;
    width: .3em;
    height: .3em;
    margin-left: .12em;
    overflow: visible;
    color: var(--accent);
    opacity: 0;
    transform: translateY(-.08em);
    transition: opacity .4s ease, transform .18s ease;
  }
  .tech-btn.is-ready .tech-caret{ opacity: 1; }
  .tech-btn[aria-expanded="true"] .tech-caret{ transform: translateY(-.08em) rotate(180deg); }
  .tech-menu{
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    z-index: 50;
    min-width: min(100%, 360px);
    padding: 6px 0;
    list-style: none;
    background: var(--accent);
    box-shadow: 0 14px 40px rgba(0,0,0,.3);
    font-size: clamp(16px, 1.8vw, 22px);
    font-weight: 700;
    letter-spacing: .01em;
    line-height: 1.2;
  }
  .tech-menu a{
    display: block;
    padding: 12px 22px;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
  }
  .tech-menu a:hover, .tech-menu a:focus-visible{ background: var(--ground); outline: none; }

  /* ---- hero ---- */
  main{
    flex: 1;
    display: flex;
    align-items: center;
  }

  .lockup{
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    font-weight: 900;
    font-size: clamp(2.6rem, 11.2vw, 9.5rem);
    line-height: .96;
    letter-spacing: -.035em;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    color: inherit;
    font-family: inherit;
    text-align: left;
  }

  .fixed-word{ white-space: nowrap; }

  /* the slot: one line tall (plus a little room for descenders), clipped */
  .slot{
    position: relative;
    overflow: hidden;
    height: 1.18em;
    align-self: center;
    flex: 0 0 auto;
  }
  .reel{
    display: flex;
    flex-direction: column;
    will-change: transform, filter;
  }
  .reel span{
    height: 1.18em;
    line-height: 1.18em;
    white-space: nowrap;
    display: block;
  }
  .measure{
    position: absolute;
    visibility: hidden;
    white-space: nowrap;
    pointer-events: none;
    left: -9999px;
    top: 0;
  }

  /* ---- footer ---- */
  .foot{
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px 24px;
    padding-top: clamp(16px, 2vw, 24px);
    border-top: 1px solid var(--hairline);
    font-size: clamp(11px, 1.05vw, 13px);
    font-weight: 500;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .foot a{ color: var(--muted); text-decoration: none; }
  .foot a:hover, .foot a:focus-visible{ color: var(--ink); }
  .foot-links{ display: flex; flex-wrap: wrap; gap: 12px 20px; }

  @media (prefers-reduced-motion: reduce){
    .reel{ transition: none !important; filter: none !important; }
  }
</style>
</head>
<body>

<div class="shell">
  <main>
    <h1 class="lockup" id="lockup">
      <span class="fixed-word">JUSTOPEN.</span><span class="tech" id="tech"><button class="tech-btn" id="techBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="techMenu" aria-label="technologies, open Just Open sites menu" disabled><span class="slot" id="slot" aria-hidden="true"><span class="reel" id="reel"></span></span><svg class="tech-caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3 5 7.5 9 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" vector-effect="non-scaling-stroke" style="stroke-width:max(2px,.06em)"/></svg></button><ul class="tech-menu" id="techMenu" hidden>
        <li><a href="https://staircode.app">staircode</a></li>
        <li><a href="https://justopenarch.com">just open architecture</a></li>
        <li><a href="/">just open</a></li>
        <li><a href="https://padufs.netlify.app">padufs</a></li>
      </ul></span>
      <span class="measure" id="measure">technologies</span>
    </h1>
  </main>

  <footer class="foot">
    <span>© 2026 Just Open Technologies Inc.</span>
    <span class="foot-links">
      <a href="/about">About</a>
      <a href="/blog">Blog</a>
      <a href="/legal">Legal</a>
      <a href="mailto:hello@justopen.tech">hello@justopen.tech</a>
    </span>
  </footer>
</div>

<script>
(function(){
  var WORDS = [
    "art","architecture","building","automotive","rockets","audio","robotics",
    "software","structures","energy","housing","cities","code","design","data",
    "hardware","materials","acoustics","aerospace","infrastructure","fabrication",
    "engineering","optics","transit","climate","furniture","machines","sensors",
    "tooling","research","interiors","bridges","habitats","logistics",
    "manufacturing","standards","drawings","systems","geometry","concrete",
    "timber","steel","glass","daylight","airflow","zoning","permits","models"
  ];
  var FINAL = "technologies";

  var reel = document.getElementById("reel");
  var slot = document.getElementById("slot");
  var measure = document.getElementById("measure");

  var LOOPS = 3;
  var list = [];
  for (var l = 0; l < LOOPS; l++){
    var pool = WORDS.slice();
    for (var i = pool.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    list = list.concat(pool);
  }
  list.push(FINAL);

  var frag = document.createDocumentFragment();
  for (var k = 0; k < list.length; k++){
    var s = document.createElement("span");
    s.textContent = list[k];
    frag.appendChild(s);
  }
  reel.appendChild(frag);

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var stepH = 0, distance = 0, running = false, rafId = 0;

  function sizeSlot(){
    slot.style.width = Math.ceil(measure.getBoundingClientRect().width) + "px";
    stepH = reel.firstChild.getBoundingClientRect().height;
    distance = stepH * (list.length - 1);
  }

  function settle(){
    reel.style.transform = "translate3d(0," + (-distance) + "px,0)";
    reel.style.filter = "none";
  }

  // easeOutQuint: very fast at the start, long gentle glide into the last word
  function ease(t){ return 1 - Math.pow(1 - t, 5); }

  function play(){
    sizeSlot();
    if (reduced){ settle(); ready(); return; }
    if (running) return;
    running = true;
    var DUR = 3200;
    var start = performance.now();
    var prev = 0;

    function frame(now){
      var t = Math.min((now - start) / DUR, 1);
      var e = ease(t);
      var y = e * distance;
      var velocity = Math.abs(y - prev);
      prev = y;
      var blur = Math.min(velocity * 0.09, 4.5);
      reel.style.transform = "translate3d(0," + (-y) + "px,0)";
      reel.style.filter = blur > 0.25 ? "blur(" + blur.toFixed(2) + "px)" : "none";
      if (t < 1){ rafId = requestAnimationFrame(frame); }
      else { settle(); running = false; ready(); }
    }
    rafId = requestAnimationFrame(frame);
  }

  function relayout(){
    cancelAnimationFrame(rafId);
    running = false;
    sizeSlot();
    settle();
    ready();
  }

  var rt;
  window.addEventListener("resize", function(){
    clearTimeout(rt);
    rt = setTimeout(relayout, 150);
  });

  // ---- menu: only usable once the reel has settled on "technologies" ----
  var tech = document.getElementById("tech");
  var btn = document.getElementById("techBtn");
  var menu = document.getElementById("techMenu");
  var links = menu.querySelectorAll("a");

  function ready(){ btn.disabled = false; btn.classList.add("is-ready"); }
  function isOpen(){ return !menu.hidden; }
  function open(){ menu.hidden = false; btn.setAttribute("aria-expanded", "true"); links[0].focus(); }
  function close(returnFocus){
    menu.hidden = true;
    btn.setAttribute("aria-expanded", "false");
    if (returnFocus) btn.focus();
  }

  btn.addEventListener("click", function(){
    if (running) return;
    isOpen() ? close(true) : open();
  });
  btn.addEventListener("keydown", function(e){
    if (e.key === "ArrowDown" && !isOpen() && !running){ e.preventDefault(); open(); }
  });
  menu.addEventListener("keydown", function(e){
    var i = Array.prototype.indexOf.call(links, document.activeElement);
    if (e.key === "ArrowDown"){ links[Math.min(i + 1, links.length - 1)].focus(); }
    else if (e.key === "ArrowUp"){ links[Math.max(i - 1, 0)].focus(); }
    else if (e.key === "Escape"){ close(true); }
    else if (e.key === "Tab"){ close(false); return; }
    else return;
    e.preventDefault();
  });
  document.addEventListener("mousedown", function(e){
    if (isOpen() && !tech.contains(e.target)) close(false);
  });

  function boot(){ sizeSlot(); reel.style.transform = "translate3d(0,0,0)"; play(); }

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(boot).catch(boot);
  } else {
    window.addEventListener("load", boot);
  }
})();
</script>

</body>
</html>
