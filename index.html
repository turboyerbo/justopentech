<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JUSTOPEN.technologies</title>
<meta name="description" content="Just Open Technologies — software and architecture, open by design." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800;900&display=swap">
<style>
  :root{
    --ink: #FFFFFF;
    --ground: #002FA7;
    --ground-deep: #00248A;
    --muted: rgba(255,255,255,.62);
    --hairline: rgba(255,255,255,.22);
    --display: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body{
    background: var(--ground);
    color: var(--ink);
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .shell{
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding-inline: clamp(16px, 4vw, 48px);
    padding-block: clamp(18px, 3vw, 32px);
    box-sizing: border-box;
    gap: clamp(24px, 6vh, 64px);
  }

  /* ---- nav ---- */
  .nav{
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: clamp(14px, 2.2vw, 28px);
    font-size: clamp(11px, 1.1vw, 13px);
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .nav a{
    color: var(--muted);
    text-decoration: none;
    padding-block: 4px;
    border-bottom: 1px solid transparent;
    transition: color .18s ease, border-color .18s ease;
  }
  .nav a:hover, .nav a:focus-visible{ color: var(--ink); border-bottom-color: var(--ink); }
  .nav a:focus-visible{ outline: 2px solid var(--ink); outline-offset: 4px; border-bottom-color: transparent; }

  /* ---- hero ---- */
  main{
    flex: 1;
    display: flex;
    align-items: center;
  }

  .lockup{
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    font-weight: 900;
    font-size: clamp(2.6rem, 11.2vw, 9.5rem);
    line-height: .96;
    letter-spacing: -.035em;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    color: inherit;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
  }
  .lockup:focus-visible{ outline: 2px solid var(--ink); outline-offset: 12px; }

  .fixed-word{ white-space: nowrap; }

  /* the slot: one line tall (plus a little room for descenders), clipped */
  .slot{
    position: relative;
    overflow: hidden;
    height: 1.18em;
    align-self: center;
    flex: 0 0 auto;
  }
  .reel{
    display: flex;
    flex-direction: column;
    will-change: transform, filter;
  }
  .reel span{
    height: 1.18em;
    line-height: 1.18em;
    white-space: nowrap;
    display: block;
  }
  .measure{
    position: absolute;
    visibility: hidden;
    white-space: nowrap;
    pointer-events: none;
    left: -9999px;
    top: 0;
  }

  /* ---- footer ---- */
  .foot{
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px 24px;
    padding-top: clamp(16px, 2vw, 24px);
    border-top: 1px solid var(--hairline);
    font-size: clamp(11px, 1.05vw, 13px);
    font-weight: 500;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .foot a{ color: var(--muted); text-decoration: none; }
  .foot a:hover, .foot a:focus-visible{ color: var(--ink); }
  .foot-links{ display: flex; flex-wrap: wrap; gap: 12px 20px; }

  @media (prefers-reduced-motion: reduce){
    .reel{ transition: none !important; filter: none !important; }
  }
</style>
</head>
<body>

<div class="shell">
  <nav class="nav" aria-label="Primary">
    <a href="https://staircode.app">StairCode</a>
    <a href="/portfolio">Projects</a>
    <a href="https://justopenarch.com">Just Open Arch</a>
    <a href="/about">About</a>
    <a href="/blog">Blog</a>
    <a href="/legal">Legal</a>
  </nav>

  <main>
    <button class="lockup" id="lockup" type="button" aria-label="JUSTOPEN.technologies — replay animation">
      <span class="fixed-word">JUSTOPEN.</span><span class="slot" id="slot" aria-hidden="true"><span class="reel" id="reel"></span></span>
      <span class="measure" id="measure">technologies</span>
    </button>
  </main>

  <footer class="foot">
    <span>© 2026 Just Open Technologies Inc.</span>
    <span class="foot-links">
      <a href="/about">About</a>
      <a href="/blog">Blog</a>
      <a href="/legal">Legal</a>
      <a href="mailto:hello@justopen.tech">hello@justopen.tech</a>
    </span>
  </footer>
</div>

<script>
(function(){
  var WORDS = [
    "art","architecture","building","automotive","rockets","audio","robotics",
    "software","structures","energy","housing","cities","code","design","data",
    "hardware","materials","acoustics","aerospace","infrastructure","fabrication",
    "engineering","optics","transit","climate","furniture","machines","sensors",
    "tooling","research","interiors","bridges","habitats","logistics",
    "manufacturing","standards","drawings","systems","geometry","concrete",
    "timber","steel","glass","daylight","airflow","zoning","permits","models"
  ];
  var FINAL = "technologies";

  var reel = document.getElementById("reel");
  var slot = document.getElementById("slot");
  var measure = document.getElementById("measure");
  var lockup = document.getElementById("lockup");

  var LOOPS = 3;
  var list = [];
  for (var l = 0; l < LOOPS; l++){
    var pool = WORDS.slice();
    for (var i = pool.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    list = list.concat(pool);
  }
  list.push(FINAL);

  var frag = document.createDocumentFragment();
  for (var k = 0; k < list.length; k++){
    var s = document.createElement("span");
    s.textContent = list[k];
    frag.appendChild(s);
  }
  reel.appendChild(frag);

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var stepH = 0, distance = 0, running = false, rafId = 0;

  function sizeSlot(){
    slot.style.width = Math.ceil(measure.getBoundingClientRect().width) + "px";
    stepH = reel.firstChild.getBoundingClientRect().height;
    distance = stepH * (list.length - 1);
  }

  function settle(){
    reel.style.transform = "translate3d(0," + (-distance) + "px,0)";
    reel.style.filter = "none";
  }

  // easeOutQuint: very fast at the start, long gentle glide into the last word
  function ease(t){ return 1 - Math.pow(1 - t, 5); }

  function play(){
    sizeSlot();
    if (reduced){ settle(); return; }
    if (running) return;
    running = true;
    var DUR = 3200;
    var start = performance.now();
    var prev = 0;

    function frame(now){
      var t = Math.min((now - start) / DUR, 1);
      var e = ease(t);
      var y = e * distance;
      var velocity = Math.abs(y - prev);
      prev = y;
      var blur = Math.min(velocity * 0.09, 4.5);
      reel.style.transform = "translate3d(0," + (-y) + "px,0)";
      reel.style.filter = blur > 0.25 ? "blur(" + blur.toFixed(2) + "px)" : "none";
      if (t < 1){ rafId = requestAnimationFrame(frame); }
      else { settle(); running = false; }
    }
    rafId = requestAnimationFrame(frame);
  }

  function relayout(){
    cancelAnimationFrame(rafId);
    running = false;
    sizeSlot();
    settle();
  }

  var rt;
  window.addEventListener("resize", function(){
    clearTimeout(rt);
    rt = setTimeout(relayout, 150);
  });

  lockup.addEventListener("click", function(){
    if (running) return;
    reel.style.transform = "translate3d(0,0,0)";
    requestAnimationFrame(play);
  });

  function boot(){ sizeSlot(); reel.style.transform = "translate3d(0,0,0)"; play(); }

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(boot).catch(boot);
  } else {
    window.addEventListener("load", boot);
  }
})();
</script>

</body>
</html>
